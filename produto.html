</div>

// PEGAR ID
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

if (!id || !produtos[id]) {
    alert("Produto não encontrado!");
    window.location.href = "index.html";
}

const produto = produtos[id];

// FALLBACK
let corSelecionada = params.get("cor") || "azul";
let tamanhoSelecionado = "";

// PREENCHER
document.getElementById("nome").innerText = produto.nome;
document.getElementById("preco").innerText = produto.preco;

if (produto.imagens.principal) {
    document.getElementById("area-cores").style.display = "none";
}

carregarImagens(corSelecionada);
marcarCorInicial(corSelecionada);

function carregarImagens(cor) {
    const lista = produto.imagens[cor] || produto.imagens.principal;

    document.getElementById("imagem-principal").src = lista[0];

    document.getElementById("img1").src = lista[0];
    document.getElementById("img2").src = lista[1];
    document.getElementById("img3").src = lista[2];
}

// TROCAR IMAGEM
function trocarImagem(img) {
    document.getElementById("imagem-principal").src = img.src;
}

// TAMANHO
function selecionarTamanho(botao) {
    let botoes = document.querySelectorAll(".tamanhos button");

    botoes.forEach(b => {
        b.style.background = "#0b0b0e";
        b.style.color = "white";
    });

    botao.style.background = "#6a00ff";
    botao.style.color = "white";

    tamanhoSelecionado = botao.innerText;
}

// COR
function selecionarCor(elemento, cor) {
    let cores = document.querySelectorAll(".cor");

    cores.forEach(c => c.style.border = "2px solid #ddd");

    elemento.style.border = "2px solid #6a00ff";

    corSelecionada = cor;

    carregarImagens(cor);
}

// 🛒 ADICIONAR AO CARRINHO
function adicionarCarrinho() {
    if (tamanhoSelecionado === "") {
        alert("Selecione um tamanho antes de adicionar ao carrinho!");
        return false;
    }

    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

    let existente = carrinho.find(p =>
        p.id === id &&
        p.cor === corSelecionada &&
        p.tamanho === tamanhoSelecionado
    );

    if (existente) {
        existente.qtd = (existente.qtd || 1) + 1;
    } else {
        carrinho.push({
            id: id,
            nome: produto.nome,
            preco: produto.preco,
            cor: corSelecionada,
            tamanho: tamanhoSelecionado,
            imagem: produto.imagens[corSelecionada][0],
            qtd: 1
        });
    }

    localStorage.setItem("carrinho", JSON.stringify(carrinho));

    atualizarContador();

    alert("Produto adicionado ao carrinho!");

    return true;
}

// 💳 COMPRAR
function comprarAgora() {
    const adicionado = adicionarCarrinho();

    if (adicionado) {
        window.location.href = "carrinhos.html";
    }
}


function atualizarContador() {
    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

    let total = 0;

    carrinho.forEach(p => {
        total += p.qtd || 1;
    });

    const contador = document.getElementById("contador");

    if (total > 9) {
        contador.innerText = "9+";
    } else {
        contador.innerText = total;
    }
}

atualizarContador();


function marcarCorInicial(cor) {
    const bolinha = document.querySelector("." + cor);

    if (bolinha) {
        bolinha.style.border = "2px solid #6a00ff";
    }
}



// Atualiza o header
function atualizarNomeUsuarioHeader() {
    const usuario = JSON.parse(localStorage.getItem("usuarioLogado")) || null;
    const nomeEl = document.getElementById("nomeUsuario");
    const seta = document.getElementById("setaDropdown");

    if(usuario){
        nomeEl.innerText = usuario.nome;
        seta.style.display = "inline";
    } else {
        nomeEl.innerText = "Login";
        seta.style.display = "none";
    }
}

// Decide o que fazer ao clicar no usuário
function handleUsuarioClick() {
    const usuario = JSON.parse(localStorage.getItem("usuarioLogado")) || null;

    if(usuario){
        document.getElementById("dropdownMenu").classList.toggle("show");
    } else {
        window.location.href = "Entrar.html"; // leva para login
    }
}

// Fecha dropdown clicando fora
window.onclick = function(event) {
    const menu = document.getElementById("dropdownMenu");
    if(!event.target.matches('#usuarioLogadoNome') && !event.target.matches('#usuarioLogadoNome *')) {
        if(menu.classList.contains('show')) {
            menu.classList.remove('show');
            document.getElementById("setaDropdown").classList.remove("girar");
        }
    }
}

// Função para o botão "Sair"
function sair() {
    localStorage.removeItem("usuarioLogado");
    atualizarNomeUsuarioHeader();
}

// Atualiza contador do carrinho (opcional, se tiver carrinho)
function atualizarContador() {
    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
    const contador = document.getElementById("contador");
    let total = 0;
    carrinho.forEach(p => total += p.qtd || 1);
    contador.innerText = total > 9 ? "9+" : total;
}

// Executa ao carregar
window.onload = function() {
    atualizarNomeUsuarioHeader();
    atualizarContador();
};
